[fujinet]
build_bus = RS232
build_platform = BUILD_RS232
build_board = fujiversal-palm
; Distinct zip name: shares build_platform = BUILD_RS232 with the other
; Fujiversal boards, which build_firmwarezip.py would otherwise name every
; zip after.
platform_name = FUJIVERSAL-PALM

; FujiBus over USB to a Palm handheld (developed on a Handspring Visor): the
; Palm's USB cradle plugs into the ESP32-S3's OTG port (USB-A to USB-C OTG
; adapter), and the S3 is the USB host. The Palm side is the fujinet-palm
; apps / fujinet-lib palmos platform using the Palm's "USB Library". Same
; board and pins as fujiversal-rs232 (Freenove ESP32-S3 CAM); PalmUSBChannel
; instead of the CDC-ACM channel.

[env:fujiversal-palm]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_FUJIVERSAL_RS232
    -D CONFIG_USB_HOST_ENABLED=1
    -D CONFIG_USB_PALM_HOST_ENABLED=1
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
